name: Update legislative signals

on:
  schedule:
    - cron: "0 12 * * *"
    
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: backfill-bills-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Fetch and classify bills
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_bills.py

      - name: Build lawmakers directory
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_lawmakers_index.py

      - name: Commit updated data
        run: |
          git config user.name "alphoptic-bot"
          git config user.email "actions@github.com"
          git add data/bills.json data/bills-index.json data/companies.json
          [ -d data/bills-chunks ] && git add data/bills-chunks/
          git add data/lawmakers.json data/lawmakers-index.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update legislative signals"
          git pull --rebase --autostash origin main
          git push
