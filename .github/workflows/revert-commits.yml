name: Revert commits
on:
  workflow_dispatch:
    inputs:
      shas:
        description: >
          Commit SHA(s) to revert, newest first, space-separated
          (e.g. "9a382315556af19616dca6df5a1da34025068fcc d4b5950...").
          Order matters: list the most recent bad commit first, then
          older ones -- git applies them in the order given, and
          reverting newest-first avoids conflicts with a later commit
          that already touched the same lines.
        required: true

permissions:
  contents: write

concurrency:
  group: revert-commits
  cancel-in-progress: false

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history -- git revert needs to see the target commits

      - name: Revert commits
        run: |
          git config user.name "alphoptic-bot"
          git config user.email "actions@github.com"
          git revert --no-edit ${{ github.event.inputs.shas }}
          git push
