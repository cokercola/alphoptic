name: Check summary coverage
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Run coverage check
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: |
          python scripts/check_summary_coverage.py
      # One-off diagnostic, not a real pipeline run - results go to a
      # downloadable artifact rather than being committed to data/.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: coverage_results.json
          retention-days: 14
