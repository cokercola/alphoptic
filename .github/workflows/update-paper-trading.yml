name: Update paper trading

# Schedule paused: this strategy trades off congress-trades data, which is
# on hold while we replace the FMP data source. Re-add the schedule once
# that's back. Manual runs via workflow_dispatch still work.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run paper trading strategy
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python scripts/paper_trade.py

      - name: Commit updated portfolio
        run: |
          git config user.name "alphoptic-bot"
          git config user.email "actions@github.com"
          git add data/paper-portfolio.json
          git diff --staged --quiet || git commit -m "Update paper trading portfolio"
          git push
