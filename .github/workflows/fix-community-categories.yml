name: Fix community categories
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: backfill-bills-history
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests anthropic
      - name: Run fix
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/fix_community_categories.py
      - name: Commit updated data
        if: always()
        run: |
          git config user.name "alphoptic-bot"
          git config user.email "actions@github.com"
          git add data/bills.json data/bills-index.json data/companies.json
          [ -d data/bills-chunks ] && git add data/bills-chunks/
          git diff --staged --quiet || git commit -m "Fix veterans/consumer_protection community categories"
          git pull --rebase --autostash origin main
          git push
