name: Update SEC ticker registry
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 1 * *"  # monthly, 1st of the month - picks up new IPOs, ticker/name changes
permissions:
  contents: write
concurrency:
  group: update-sec-tickers
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Download SEC company tickers
        run: python scripts/fetch_sec_tickers.py
      - name: Commit updated data
        run: |
          git config user.name "alphoptic-bot"
          git config user.email "actions@github.com"
          git add data/company_tickers_sec.json
          git diff --staged --quiet || git commit -m "Refresh SEC ticker registry"
          git pull --rebase --autostash origin main
          git push
