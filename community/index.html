async function init() {
  renderSidebar('community');

  document.getElementById('updated-at').textContent = 'Updated ' + new Date(data.updated_at).toLocaleString();

}
init().catch(err => {
  console.error(err);
  document.getElementById('community-page').innerHTML = `<div class="empty-note">Could not load community data.</div>`;
});
