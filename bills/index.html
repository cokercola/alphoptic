<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bills — Alphoptic</title>
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
<div id="site-header"></div>
<div class="layout two-col">
  <nav class="sidebar" id="sidebar"></nav>
  <main>
    <div class="breadcrumb"><a href="/index.html">Dashboard</a> / Bills</div>
    <div class="section-label" style="display:flex; align-items:center; justify-content:space-between;">
      <span>Bills by stage</span>
      <label style="font-size:13px; font-weight:normal; display:flex; align-items:center; gap:6px; cursor:pointer;">
        <input type="checkbox" id="stalled-toggle">
        Stalled only (no action in 180+ days)
      </label>
    </div>
    <div id="stage-breakdown"></div>
    <div class="section-label" id="bills-list-heading">All tracked bills</div>
    <table class="data-table" id="bills-table">
      <thead>
        <tr><th>Bill</th><th>Industry</th><th>Direction</th><th>Passage odds</th><th>Impact</th><th>Stage</th></tr>
      </thead>
      <tbody id="bills-body"></tbody>
    </table>
    <div id="bills-pagination" style="margin-top:14px; text-align:center;"></div>
  </main>
</div>
<script src="/assets/site.js"></script>
<script src="/assets/donate.js"></script>
<script src="/assets/header.js"></script>
<script>
let allSignals = [];
let currentStageFilter = 'all';
let currentCategoryFilter = null;
let currentIndustryFilter = null;
let currentPage = 1;
const PAGE_SIZE = 25;

const STALLED_THRESHOLD_DAYS = 180;
// Only "still in progress" stages can be stalled -- a became_law or
// failed_vetoed bill having an old last-action date is expected and
// correct, not a sign of anything dormant.
const STALLABLE_STAGES = new Set(['introduced', 'committee', 'passed_one_chamber', 'passed_both']);

function daysSince(dateStr) {
  if (!dateStr) return null;
  const diffMs = Date.now() - new Date(dateStr).getTime();
  return Math.floor(diffMs / (1000 * 60 * 60 * 24));
}

function isStalled(signal) {
  if (!STALLABLE_STAGES.has(signal.stage)) return false;
  const days = daysSince(signal.last_action_date);
  return days !== null && days >= STALLED_THRESHOLD_DAYS;
}

function renderBillsTable(stageFilter, resetPage = true) {
  currentStageFilter = stageFilter;
  if (resetPage) currentPage = 1;
  const body = document.getElementById('bills-body');
  const stalledOnly = document.getElementById('stalled-toggle').checked;

  let filtered = stageFilter === 'all'
    ? allSignals
    : allSignals.filter(s => s.stage === stageFilter);

  if (stalledOnly) {
    filtered = filtered.filter(isStalled);
  }
  if (currentCategoryFilter) {
    filtered = filtered.filter(s => s.community_category === currentCategoryFilter);
  }
  if (currentIndustryFilter) {
    filtered = filtered.filter(s => s.industry === currentIndustryFilter);
  }

  // Build the contextual heading + clear-filter link
  const headingEl = document.getElementById('bills-list-heading');
  let headingParts = [];
  if (stalledOnly) headingParts.push(`Stalled bills (no action in ${STALLED_THRESHOLD_DAYS}+ days)`);
  if (currentCategoryFilter) headingParts.push(`Community: ${currentCategoryFilter.replace(/_/g, ' ')}`);
  if (currentIndustryFilter) headingParts.push(`Industry: ${currentIndustryFilter}`);
  const hasActiveFilter = currentCategoryFilter || currentIndustryFilter;
  headingEl.innerHTML = (headingParts.length ? headingParts.join(' · ') : 'All tracked bills')
    + (hasActiveFilter ? ' <a href="/bills/index.html" style="font-size:12px; font-weight:normal; color:var(--blue); margin-left:8px;">Clear filter ×</a>' : '');

  if (!filtered.length) {
    const emptyMsg = stalledOnly
      ? `No stalled bills right now — everything currently tracked has had action in the last ${STALLED_THRESHOLD_DAYS} days.`
      : 'No bills match this filter.';
    body.innerHTML = `<tr><td colspan="6" class="empty-note">${emptyMsg}</td></tr>`;
    document.getElementById('bills-pagination').innerHTML = '';
    return;
  }

  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  currentPage = Math.min(currentPage, totalPages);
  const pageItems = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  body.innerHTML = pageItems.map(s => {
    const days = daysSince(s.last_action_date);
    const staleBadge = isStalled(s) ? ` <span style="color:var(--text-secondary); font-size:11px;">(${days}d stalled)</span>` : '';
    return `
    <tr>
      <td><a href="detail.html?id=${s.bill_id}">${s.bill_id}</a> — ${s.title}${staleBadge}</td>
      <td>${s.industry}</td>
      <td>${directionPill(s.direction)}</td>
      <td>${s.passage_probability}%</td>
      <td>${s.impact_score}/100</td>
      <td>${stagePill(s.stage, s.stageLabel)}</td>
    </tr>
  `;
  }).join('');

  const pager = document.getElementById('bills-pagination');
  if (totalPages <= 1) {
    pager.innerHTML = '';
  } else {
    pager.innerHTML = `
      <button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">← Prev</button>
      <span style="margin:0 10px; font-size:13px; color:var(--text-muted);">Page ${currentPage} of ${totalPages} (${filtered.length} bills)</span>
      <button class="pagination-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">Next →</button>
    `;
  }
}

function goToPage(page) {
  currentPage = page;
  renderBillsTable(currentStageFilter, false);
  document.getElementById('bills-table').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function init() {
  renderSidebar(new URLSearchParams(window.location.search).get('stalled') === '1' ? 'stalled' : 'bills');
  const data = await fetchSiteData();
  document.getElementById('updated-at').textContent = 'Updated ' + new Date(data.updated_at).toLocaleString();

  if (!data.signals.length) {
    document.getElementById('bills-body').innerHTML = `<tr><td colspan="6" class="empty-note">No bills tracked yet.</td></tr>`;
    return;
  }

  // Attach a display label per signal for the stage pill, derived from
  // the summary's stage_breakdown (same source the bar/tabs use).
  const labelByStage = {};
  (data.summary.stage_breakdown || []).forEach(s => { labelByStage[s.stage] = s.label; });
  allSignals = data.signals.map(s => ({ ...s, stageLabel: labelByStage[s.stage] || s.stage }));

  renderStageBreakdown('stage-breakdown', data.summary, (stage) => renderBillsTable(stage));

  // Deep links from the dashboard's Stalled teaser, or from the
  // Community/Industries pages' "View all" links
  const params = new URLSearchParams(window.location.search);
  if (params.get('stalled') === '1') {
    document.getElementById('stalled-toggle').checked = true;
  }
  if (params.get('category')) {
    currentCategoryFilter = params.get('category');
  }
  if (params.get('industry')) {
    currentIndustryFilter = params.get('industry');
  }

  renderBillsTable('all');

  document.getElementById('stalled-toggle').addEventListener('change', () => {
    renderBillsTable(currentStageFilter);
  });
}

init().catch(err => {
  console.error(err);
  document.getElementById('bills-body').innerHTML = `<tr><td colspan="6" class="empty-note">Could not load bill data.</td></tr>`;
});
</script>
  <div id="site-footer"></div>
  <script src="/assets/footer.js"></script>
</body>
</html>
