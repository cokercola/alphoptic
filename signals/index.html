<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signals — Alphoptic</title>
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
<div id="site-header"></div>
<div class="layout two-col">
  <nav class="sidebar" id="sidebar"></nav>
  <main>
    <div class="breadcrumb"><a href="/index.html">Dashboard</a> / Signals</div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <div class="section-label" style="margin:0;">Current signals</div>
      <select id="sort-select" style="background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:12px;">
        <option value="impact">Sort by impact</option>
        <option value="probability">Sort by passage probability</option>
        <option value="confidence">Sort by confidence</option>
      </select>
    </div>
    <div id="signal-list"></div>
    <div id="signal-pagination" class="pagination-row"></div>
  </main>
</div>
<script src="/assets/site.js"></script>
<script src="/assets/donate.js"></script>
<script src="/assets/header.js"></script>
<script>
let allSignals = [];
let currentPage = 1;
const PAGE_SIZE = 30;

function render(sortKey) {
  const keyMap = { impact: 'impact_score', probability: 'passage_probability', confidence: 'confidence' };
  const sorted = [...allSignals].sort((a, b) => b[keyMap[sortKey]] - a[keyMap[sortKey]]);
  renderPage(sorted, currentPage);
}

function renderPage(sorted, page) {
  const list = document.getElementById('signal-list');
  const paginationEl = document.getElementById('signal-pagination');

  if (!sorted.length) {
    list.innerHTML = `<div class="empty-note">No signals yet.</div>`;
    paginationEl.innerHTML = '';
    return;
  }

  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
  page = Math.min(Math.max(1, page), totalPages);
  currentPage = page;

  const start = (page - 1) * PAGE_SIZE;
  const pageItems = sorted.slice(start, start + PAGE_SIZE);

  list.innerHTML = pageItems.map(s => `
    <a class="signal-card ${s.direction}" href="/bills/detail.html?id=${s.bill_id}">
      <div class="signal-head">
        <span>${s.bill_id} — ${s.title}</span>
        <span class="prob ${s.direction}">${s.direction.toUpperCase()} ${s.passage_probability}%${signalInfoIcon(s.direction, s.passage_probability)}</span>
      </div>
      <div class="signal-sub">${s.industry} · impact ${s.impact_score}/100 · confidence ${s.confidence}% · ${s.companies.map(c => c.ticker).join(', ')}</div>
    </a>
  `).join('');

  paginationEl.innerHTML = paginationHTML(page, totalPages, sorted.length, start, start + pageItems.length);
  initInfoTooltips();

  const prevBtn = document.getElementById('pg-prev');
  const nextBtn = document.getElementById('pg-next');
  if (prevBtn) prevBtn.addEventListener('click', () => {
    currentPage = page - 1;
    render(document.getElementById('sort-select').value);
    scrollToListTop();
  });
  if (nextBtn) nextBtn.addEventListener('click', () => {
    currentPage = page + 1;
    render(document.getElementById('sort-select').value);
    scrollToListTop();
  });
}

function paginationHTML(page, totalPages, total, startIdx, endIdx) {
  return `
    <div class="pagination-info">Showing ${startIdx + 1}–${endIdx} of ${total.toLocaleString()}</div>
    <div class="pagination-controls">
      <button id="pg-prev" ${page <= 1 ? 'disabled' : ''}>&larr; Previous</button>
      <span class="pagination-page">Page ${page} of ${totalPages.toLocaleString()}</span>
      <button id="pg-next" ${page >= totalPages ? 'disabled' : ''}>Next &rarr;</button>
    </div>
  `;
}

function scrollToListTop() {
  document.getElementById('signal-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function init() {
  renderSidebar('signals');
  const data = await fetchSiteData();
  document.getElementById('updated-at').textContent = 'Updated ' + new Date(data.updated_at).toLocaleString();
  allSignals = data.signals;
  render('impact');
  document.getElementById('sort-select').addEventListener('change', e => {
    currentPage = 1;
    render(e.target.value);
  });
}
init().catch(err => {
  console.error(err);
  document.getElementById('signal-list').innerHTML = `<div class="empty-note">Could not load signal data.</div>`;
});
</script>
  <div id="site-footer"></div>
  <script src="/assets/footer.js"></script>
</body>
</html>
