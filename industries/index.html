<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industries — Alphoptic</title>
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
<div id="site-header"></div>
<div class="layout two-col">
  <nav class="sidebar" id="sidebar"></nav>
  <main>
    <div class="breadcrumb"><a href="/index.html">Dashboard</a> / Industries</div>
    <div class="section-label">Industries with active legislation</div>
    <div id="industry-list"></div>
  </main>
</div>
<script src="/assets/site.js"></script>
<script src="/assets/donate.js"></script>
<script src="/assets/header.js"></script>
<script>
async function init() {
  renderSidebar('industries');
  const res = await fetch('/data/bills-index.json');
  if (!res.ok) throw new Error('Failed to load /data/bills-index.json');
  const data = await res.json();
  document.getElementById('updated-at').textContent = 'Updated ' + new Date(data.updated_at).toLocaleString();

  // Claude's industry classification is free text, not a fixed list
  // (unlike community_category), so minor formatting differences
  // between runs -- "Healthcare/Insurance" vs "Healthcare / Insurance"
  // -- would otherwise fragment into separate cards for what's really
  // the same industry. Normalizing spacing around / and & here merges
  // those without touching the stored data.
  function normalizeIndustryLabel(industry) {
    return (industry || 'Unknown')
      .trim()
      .replace(/\s*\/\s*/g, '/')
      .replace(/\s*&\s*/g, ' & ')
      .replace(/\s+/g, ' ');
  }

  const byIndustry = {};
  data.signals.forEach(s => {
    const key = normalizeIndustryLabel(s.industry);
    if (!byIndustry[key]) byIndustry[key] = [];
    byIndustry[key].push(s);
  });
  const list = document.getElementById('industry-list');
  const industries = Object.keys(byIndustry).sort((a, b) => a.localeCompare(b));
  if (!industries.length) {
    list.innerHTML = `<div class="empty-note">No industry data yet.</div>`;
    return;
  }
  const CAP = 10;
  list.innerHTML = industries.map(industry => {
    const bills = byIndustry[industry];
    const avgImpact = Math.round(bills.reduce((sum, b) => sum + b.impact_score, 0) / bills.length);
    const shown = bills.slice(0, CAP);
    const remaining = bills.length - shown.length;
    return `
      <div class="industry-card">
        <h3>${industry}</h3>
        <div class="meta">${bills.length} bill${bills.length > 1 ? 's' : ''} tracked · avg impact ${avgImpact}/100</div>
        ${shown.map(b => `
          <div style="font-size:13px; padding:4px 0;">
            <a href="/bills/detail.html?id=${b.bill_id}" style="color:var(--blue); text-decoration:none;">${b.bill_id}</a>
            — ${b.title} ${directionPill(b.direction)}
          </div>
        `).join('')}
        ${remaining > 0 ? `
          <div style="font-size:13px; padding:6px 0 0;">
            <a href="/bills/index.html?industry=${encodeURIComponent(industry)}" style="color:var(--blue); text-decoration:none;">View all ${bills.length} →</a>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}
init().catch(err => {
  console.error(err);
  document.getElementById('industry-list').innerHTML = `<div class="empty-note">Could not load industry data.</div>`;
});
</script>
  <div id="site-footer"></div>
  <script src="/assets/footer.js"></script>
</body>
</html>
